[project]
name = "agentguard"
version = "0.3.0"
description = "Finds and red-teams the vulnerable parts of an AI agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "click>=8.1",
    "pyyaml>=6.0",
    "litellm>=1.95,<1.106",
    "mcp>=1.28,<2.0",
    # Pinned: checkpointing (crewai.state) and the LLM patch in llm.py are tested on this version.
    "crewai==1.15.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
agentguard = "agentguard.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentguard*"]

[tool.setuptools.package-data]
agentguard = ["static/*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*is deprecated.*",
]
